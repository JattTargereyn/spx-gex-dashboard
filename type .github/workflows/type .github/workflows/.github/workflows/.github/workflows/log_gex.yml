name: Log SPX GEX History

on:
  schedule:
    # Every 15 mins, Mon-Fri, covering both EST & EDT (RTH check is inside Python)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: # Lets you test it manually anytime from the Actions tab

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas yfinance
      - run: python log_gex.py
      - name: Commit & Push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gex_history.csv
          git diff --staged --quiet || git commit -m "Log GEX snapshot"
          git push
